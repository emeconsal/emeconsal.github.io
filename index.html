<h1>openGym backup</h1>
<p>A personal backup tool. Once a day it copies the data folder of my own self-hosted
<a href="https://github.com/DuarteSantos8/openGym">openGym</a> server to my own Google Drive,
using <a href="https://rclone.org">rclone</a>.</p>
<p>It is used by one person, me, for my own data. It is not a service and has no other users.</p>
